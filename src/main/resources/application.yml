spring:
  application:
    name: url-shortener-service
  datasource:
    url: jdbc:postgresql://localhost:5433/url_shortener_db
    username: app_user
    password: secretpassword
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080